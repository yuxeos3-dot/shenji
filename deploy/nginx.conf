# Rate-limit zones (must live in http{} scope; adjust the include accordingly).
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m   rate=1r/s;

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate /etc/ssl/your-domain.crt;
    ssl_certificate_key /etc/ssl/your-domain.key;

    # Request limits to avoid slowloris / oversized uploads.
    client_max_body_size 20m;
    client_body_timeout  30s;
    client_header_timeout 20s;
    send_timeout          60s;

    # Security headers.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tight CSP — adjust if you add third-party widgets.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 前端静态文件
    location / {
        root /var/www/seo-system/dist;
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caches for fingerprinted static assets.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        root /var/www/seo-system/dist;
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Login bucket gets the strict limit (brute-force protection).
    location = /api/auth/login {
        limit_req zone=api_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # General API proxy with generous burst for audit/sync endpoints.
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
